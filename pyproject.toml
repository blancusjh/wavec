[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorwave"
version = "0.2.0"
description = "Vectorial wave optics for curved interfaces and projection optics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "finufft>=2.2"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
raytracer = ["geometrical-raytracer"]
vecdiff = ["vecdiff"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["vectorwave*"]

[tool.setuptools.package-data]
vectorwave = ["data/*.json", "data/prescriptions/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
